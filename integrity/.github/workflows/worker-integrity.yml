name: worker.js integrity

on:
  workflow_dispatch:

  schedule:
    - cron: '17 3 * * *'

  push:
    paths:
      - 'integrity/worker.sha256'
      - '.github/workflows/worker-integrity.yml'

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Produktive worker.js laden
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --proto '=https' \
            --output worker-live.js \
            https://www.leistner-buersten.de/worker.js

      - name: SHA-256 vergleichen
        shell: bash
        run: |
          EXPECTED="$(tr -d '[:space:]' < integrity/worker.sha256 | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(sha256sum worker-live.js | awk '{print $1}')"

          echo "Freigegebener Hash: $EXPECTED"
          echo "Ausgelieferter Hash:  $ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::Die produktive worker.js entspricht NICHT der freigegebenen Version."
              exit 1
          fi

          echo "OK: Die produktive worker.js entspricht der freigegebenen Version."
